<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <title>mcbCode status</title>
  <style>
    :root {
      color-scheme: dark;
      --status-bg: #0b0e12;
      --status-surface: #12171d;
      --status-surface-raised: #171e26;
      --status-text: #f2f5f7;
      --status-muted: #9ba8b5;
      --status-border: #28323d;
      --status-good: #05ee93;
      --status-down: #e7007b;
      --status-radius: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--status-bg);
      color: var(--status-text);
      font-family: mcfont;
    }

    button { font: inherit; }

    .status-page {
      width: min(100% - 36px, 960px);
      margin: 0 auto;
      padding: 72px 0 54px;
    }

    .status-header { margin-bottom: 30px; }
    .eyebrow { margin: 0 0 10px; color: var(--status-muted); font-size: 14px; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 48px); line-height: 1.08; letter-spacing: 0; }
    .intro { max-width: 560px; margin: 14px 0 0; color: var(--status-muted); line-height: 1.6; }

    .status-card {
      overflow: hidden;
      border: 1px solid var(--status-border);
      border-radius: var(--status-radius);
      background: var(--status-surface);
    }

    .current-status {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 24px;
      border-bottom: 1px solid var(--status-border);
      background: linear-gradient(110deg, rgba(5, 238, 147, .08), transparent 58%);
    }

    .current-status[data-state="down"] {
      background: linear-gradient(110deg, rgba(231, 0, 123, .12), transparent 58%);
    }

    .state-mark {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(5, 238, 147, .35);
      border-radius: 12px;
      color: var(--status-good);
      background: rgba(5, 238, 147, .1);
      font-size: 21px;
      font-weight: 700;
    }

    [data-state="down"] .state-mark {
      border-color: rgba(231, 0, 123, .4);
      color: var(--status-down);
      background: rgba(231, 0, 123, .12);
    }

    .state-copy { min-width: 0; flex: 1; }
    .state-copy h2 { margin: 0; font-size: 18px; }
    .state-copy p { margin: 5px 0 0; color: var(--status-muted); font-size: 14px; }

    .refresh-button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      color: var(--status-text);
      background: var(--status-surface-raised);
      cursor: pointer;
    }

    .refresh-button:hover { border-color: #526171; }
    .refresh-button:focus-visible { outline: 2px solid var(--status-good); outline-offset: 3px; }
    .refresh-button:disabled { cursor: wait; opacity: .65; }

    .history { padding: 24px; }
    .history-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .history-heading h2 { margin: 0; font-size: 17px; }
    .history-heading p { margin: 0; color: var(--status-muted); font-size: 13px; }

    .day-bars {
      display: grid;
      grid-template-columns: repeat(var(--day-count, 7), minmax(5px, 1fr));
      gap: 6px;
      margin: 21px 0 11px;
    }

    .day-bar {
      display: grid;
      min-width: 0;
      height: 38px;
      place-items: center;
      border-radius: 6px;
      background: var(--status-good);
    }

    .day-bar[data-state="down"] { background: var(--status-down); }

    .day-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(7, 12, 16, .72);
    }

    .date-range { display: flex; justify-content: space-between; gap: 12px; color: var(--status-muted); font-size: 12px; }
    .history-note { margin: 20px 0 0; padding-top: 17px; border-top: 1px solid var(--status-border); color: var(--status-muted); font-size: 13px; line-height: 1.5; }
    .history-note strong { color: var(--status-text); font-weight: 600; }
    .loading { color: var(--status-muted); }
    .error-message { color: #ff8ac2; }

    @media (max-width: 560px) {
      .status-page { width: min(100% - 24px, 960px); padding-top: 44px; }
      .current-status { flex-wrap: wrap; padding: 18px; }
      .refresh-button { width: 100%; }
      .history { padding: 18px; }
      .day-bars { gap: 4px; }
      .day-bar { height: 32px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .refresh-button { transition: border-color 140ms ease, opacity 140ms ease; }
    }
  </style>
</head>
<body>
  <main class="status-page">
    <header class="status-header">
      <p class="eyebrow"><span style="color: #ffffff">mcb</span><span style="color: #05ee93">Code</span> availability</p>
      <h1>status</h1>
      <p class="intro">updates about the services and systems you use.</p>
    </header>

    <section class="status-card" aria-label="service status">
      <div class="current-status" id="current-status" data-state="good" aria-live="polite">
        <div class="state-mark" id="state-mark" aria-hidden="true">✓</div>
        <div class="state-copy">
          <h2 id="state-title">checking status</h2>
          <p id="state-detail" class="loading">loading the latest update…</p>
        </div>
        <button class="refresh-button" id="refresh-button" type="button">refresh status</button>
      </div>

      <div class="history">
        <div class="history-heading">
          <h2>daily history</h2>
          <p id="day-count-label">recent days</p>
        </div>
        <div class="day-bars" id="day-bars" role="list" aria-label="daily status history"></div>
        <div class="date-range" aria-hidden="true">
          <span id="first-date">—</span>
          <span id="last-date">—</span>
        </div>
        <p class="history-note" id="history-note"><strong>each bar is one day.</strong> hover or focus a bar to see its date and status.</p>
      </div>
    </section>
  </main>

  <script>
    const statusUrl = "https://status.mcbcode.com/status.json";
    const currentStatus = document.querySelector("#current-status");
    const stateMark = document.querySelector("#state-mark");
    const stateTitle = document.querySelector("#state-title");
    const stateDetail = document.querySelector("#state-detail");
    const dayBars = document.querySelector("#day-bars");
    const dayCountLabel = document.querySelector("#day-count-label");
    const firstDate = document.querySelector("#first-date");
    const lastDate = document.querySelector("#last-date");
    const historyNote = document.querySelector("#history-note");
    const refreshButton = document.querySelector("#refresh-button");

    function readableDate(dateString) {
      const date = new Date(`${dateString}T00:00:00Z`);
      if (Number.isNaN(date.getTime())) return dateString;
      return new Intl.DateTimeFormat("en", {
        month: "short",
        day: "numeric",
        year: "numeric",
        timeZone: "utc"
      }).format(date);
    }

    function setError(message) {
      currentStatus.dataset.state = "down";
      stateMark.textContent = "!";
      stateTitle.textContent = "status unavailable";
      stateDetail.textContent = message;
      stateDetail.className = "error-message";
      historyNote.textContent = "could not load the status history. try refreshing in a moment.";
    }

    function renderStatus(data) {
      if (!data || !["good", "down"].includes(data.status) || !Array.isArray(data.days)) {
        throw new Error("the status json is missing a valid status or days list.");
      }

      const isDown = data.status === "down";
      currentStatus.dataset.state = data.status;
      stateMark.textContent = isDown ? "!" : "✓";
      stateTitle.textContent = isDown ? "some services are down" : "all systems operational";
      stateDetail.className = "";
      stateDetail.textContent = data.updated_at
        ? `last updated ${new Date(data.updated_at).toLocaleString()}`
        : "everything is running normally.";

      const days = data.days
        .filter(day => day && typeof day.date === "string" && ["good", "down"].includes(day.status))
        .sort((a, b) => a.date.localeCompare(b.date));

      dayBars.replaceChildren();
      dayBars.style.setProperty("--day-count", Math.max(days.length, 1));
      dayCountLabel.textContent = `${days.length} ${days.length === 1 ? "day" : "days"}`;

      for (const day of days) {
        const bar = document.createElement("span");
        const statusName = day.status === "good" ? "good" : "down";
        const dateLabel = readableDate(day.date);
        bar.className = "day-bar";
        bar.dataset.state = day.status;
        bar.setAttribute("role", "listitem");
        bar.setAttribute("tabindex", "0");
        bar.setAttribute("aria-label", `${dateLabel}: ${statusName}${day.note ? ` — ${day.note}` : ""}`);
        bar.title = `${dateLabel}: ${statusName}${day.note ? ` — ${day.note}` : ""}`;

        const dot = document.createElement("span");
        dot.className = "day-dot";
        dot.setAttribute("aria-hidden", "true");
        bar.append(dot);
        dayBars.append(bar);
      }

      firstDate.textContent = days.length ? readableDate(days[0].date) : "no history yet";
      lastDate.textContent = days.length ? readableDate(days[days.length - 1].date) : "";

      const downCount = days.filter(day => day.status === "down").length;
      historyNote.textContent = downCount
        ? `${downCount} ${downCount === 1 ? "day" : "days"} marked as down in this history.`
        : "each bar is one day. hover or focus a bar to see its date and status.";
    }

    async function loadStatus() {
      refreshButton.disabled = true;
      stateDetail.textContent = "loading the latest update…";
      stateDetail.className = "loading";

      try {
        const response = await fetch(`${statusUrl}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`status request failed (${response.status}).`);
        renderStatus(await response.json());
      } catch (error) {
        setError("could not reach the status feed. check the json url and its cors settings.");
        console.error("status page:", error);
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", loadStatus);
    loadStatus();
    window.setInterval(loadStatus, 5 * 60 * 1000);
  </script>
</body>
</html>
